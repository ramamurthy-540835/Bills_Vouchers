name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pip-audit -r requirements.txt --strict
      - run: ruff check app tests
      - run: mypy app
      - run: pytest -q --cov=app.services.gst.validation --cov=app.services.accounting --cov=app.services.ocr --cov=app.services.razorpay --cov=app.security --cov-report=term-missing --cov-fail-under=70
      - run: docker build -t bills-voucher-backend:ci .
      - run: docker build -t bills-voucher-frontend:ci frontend
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bills-voucher-backend:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bills-voucher-frontend:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
