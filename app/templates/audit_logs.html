{% extends "base.html" %}{% block content %}<h1>Audit Logs</h1><div class="card"><div class="card-body table-responsive"><table class="table"><thead><tr><th>Time</th><th>Action</th><th>Entity</th><th>ID</th><th>Changes</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{row.created_at}}</td><td>{{row.action}}</td><td>{{row.entity}}</td><td>{{row.entity_id or ''}}</td><td><small>{{row.new_value or row.old_value or ''}}</small></td></tr>{% else %}<tr><td colspan="5">No audit events.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
