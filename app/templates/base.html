<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Finance{% endblock %} · Bills &amp; Voucher</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/app.css" rel="stylesheet"></head>
<body><div class="d-flex"><aside class="sidebar p-3"><a class="brand" href="/">Bills &amp; Voucher</a><nav class="nav flex-column mt-4 gap-1"><a href="/">Dashboard</a><a href="/gst">GST Compliance</a><a href="/gst/health">GST Health</a><a href="/gst/returns">GST Returns</a><a href="/transactions">Transactions</a><a href="/accounts">Accounts</a><a href="/expenses">Expenses</a><a href="/documents">Bills &amp; Vouchers</a><a href="/reports">Reports</a><a href="/users">Users</a><a href="/audit-logs">Audit Logs</a><a href="/settings">Settings</a></nav></aside><main class="content flex-grow-1"><header class="topbar d-flex justify-content-between align-items-center"><button class="btn btn-outline-secondary d-md-none" onclick="document.querySelector('.sidebar').classList.toggle('open')">Menu</button>{% if client %}<form action="/clients/select" method="post"><select class="form-select form-select-sm" name="client_id" onchange="this.form.submit()">{% for c in clients %}<option value="{{c.id}}" {% if c.id==client.id %}selected{% endif %}>{{c.code}} · {{c.name}}</option>{% endfor %}</select></form>{% endif %}{% if user %}<form action="/logout" method="post"><button class="btn btn-sm btn-outline-danger">Sign out</button></form>{% endif %}</header><div class="container-fluid py-4">{% block content %}{% endblock %}</div></main></div></body></html>
