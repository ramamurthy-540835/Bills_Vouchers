{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><section class="col-lg-7"><h1>Upload Bill / Voucher</h1><p class="text-secondary">Take a photo, choose an image, or upload a PDF.</p><div class="card"><div class="card-body p-4"><form id="upload-form"><select class="form-select mb-3" name="document_type">{% for t in types %}<option value="{{t.value}}">{{t.value|title}}</option>{% endfor %}</select><input class="form-control" type="file" name="file" accept="image/jpeg,image/png,application/pdf" capture="environment" required><button class="btn btn-primary mt-4">Upload document</button></form><div id="progress" class="progress mt-3 d-none"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:100%"></div></div><div id="result" class="alert mt-3 d-none"></div></div></div></section></div><script>const f=document.querySelector('#upload-form'),p=document.querySelector('#progress'),r=document.querySelector('#result');f.onsubmit=async e=>{e.preventDefault();p.classList.remove('d-none');try{let x=await fetch('/documents/upload',{method:'POST',body:new FormData(f)}),d=await x.json();r.textContent=x.ok?d.status:(d.detail||'Upload failed');r.className='alert mt-3 '+(x.ok?'alert-success':'alert-danger')}finally{p.classList.add('d-none')}};</script>{% endblock %}
