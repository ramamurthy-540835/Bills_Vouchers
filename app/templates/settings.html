{% extends "base.html" %}{% block title %}Settings{% endblock %}{% block content %}<div class="row justify-content-center"><section class="col-lg-6"><h1>Profile settings</h1>{% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}<div class="card"><div class="card-body"><form method="post"><label class="form-label">Name</label><input class="form-control mb-3" name="full_name" value="{{user.full_name}}" required><label class="form-label">New password <span class="text-secondary">(optional)</span></label><input class="form-control mb-3" type="password" name="new_password" minlength="8"><button class="btn btn-primary">Save settings</button></form></div></div></section></div>{% endblock %}
