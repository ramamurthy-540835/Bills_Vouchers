<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/app.css" rel="stylesheet"></head><body class="login-bg"><main class="login-card"><h1>Create account</h1><p class="text-secondary">Bills &amp; Voucher Finance Management</p>{% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label class="form-label">Full name</label><input class="form-control mb-3" name="full_name" required autofocus><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" minlength="8" required><button class="btn btn-primary w-100">Create account</button></form><p class="text-center mt-3 mb-0">Already have an account? <a href="/login">Sign in</a></p></main></body></html>
