{% extends "base.html" %}{% block title %}Users{% endblock %}{% block content %}<h1>Users</h1><div class="card"><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Email</th><th>Created</th><th>Access</th></tr></thead><tbody>{% for account in users %}<tr><td>{{account.full_name}}</td><td>{{account.email}}</td><td>{{account.created_at}}</td><td><form class="d-flex gap-2" method="post" action="/users/{{account.id}}"><select class="form-select form-select-sm" name="role">{% for role in roles %}<option value="{{role.value}}" {% if account.role==role.value %}selected{% endif %}>{{role.value|title}}</option>{% endfor %}</select><input type="hidden" name="is_active" value="false"><div class="form-check"><input class="form-check-input" type="checkbox" name="is_active" value="true" {% if account.is_active %}checked{% endif %}><label class="form-check-label">Active</label></div><button class="btn btn-sm btn-primary">Save</button></form></td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
