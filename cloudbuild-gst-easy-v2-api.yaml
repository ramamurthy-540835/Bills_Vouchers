# New isolated V2 image build; never updates any existing service.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile", "-t", "asia-south1-docker.pkg.dev/$PROJECT_ID/gst-easy-v2/api:${_REVISION}", "."]
images:
  - "asia-south1-docker.pkg.dev/$PROJECT_ID/gst-easy-v2/api:${_REVISION}"
serviceAccount: projects/$PROJECT_ID/serviceAccounts/gst-easy-v2-build@$PROJECT_ID.iam.gserviceaccount.com
substitutions:
  _REVISION: manual-review-required
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 1200s
