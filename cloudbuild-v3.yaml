# V3 images only. Deployment is separate and requires passing local gates.
steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/aidirac-503309/finance/bills-voucher:${_TAG}', '.']
  - id: frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '--build-arg', 'NEXT_PUBLIC_GST_MODULE_NAME=${_GST_NAME}', '-t', 'asia-south1-docker.pkg.dev/aidirac-503309/finance/bills-voucher-web:${_TAG}', 'frontend']
images:
  - 'asia-south1-docker.pkg.dev/aidirac-503309/finance/bills-voucher:${_TAG}'
  - 'asia-south1-docker.pkg.dev/aidirac-503309/finance/bills-voucher-web:${_TAG}'
substitutions:
  _TAG: gst-easy-v3-20261009-r4
  _GST_NAME: GST Easy
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
