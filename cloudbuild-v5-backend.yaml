steps:
  - id: tests
    name: python:3.12-slim
    entrypoint: sh
    args: ['-c', 'pip install -e ".[test,mcp]" && ruff check app tests && mypy app && pytest -q']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/aidirac-503309/finance/bills-voucher:${_TAG}', '.']
images: ['asia-south1-docker.pkg.dev/aidirac-503309/finance/bills-voucher:${_TAG}']
substitutions:
  _TAG: v5-preview-session-renewal
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
