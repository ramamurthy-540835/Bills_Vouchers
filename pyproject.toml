[project]
name = "bills-voucher"
version = "0.1.0"
description = "Professional finance and document management application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30", "google-cloud-bigquery>=3.25", "google-cloud-storage>=2.18", "google-genai>=1.30",
  "jinja2>=3.1", "python-multipart>=0.0.9", "pydantic-settings>=2.6", "passlib[bcrypt]>=1.7",
  "itsdangerous>=2.2", "email-validator>=2.2", "bcrypt>=4.0,<4.1"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
cloud = ["razorpay>=1.4"]
mcp = ["mcp>=1.9"]
test = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
